name: Build Cloudy9
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudy9-build-${{ github.ref }}
  cancel-in-progress: true
env:
  PLUGIN_VERSION: "0.1"
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE
        run: |
          curl -fL https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-osx.zip -o juce.zip
          unzip -q juce.zip
      - name: DSP tests
        run: c++ -std=c++17 -O2 Tests/dsp_test.cpp -o dsp_test && ./dsp_test
      - name: Configure
        run: cmake -S . -B build -G Xcode -DJUCE_DIR="$PWD/JUCE" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --target Cloudy9_VST3 Cloudy9_AAX
      - name: Sign and package
        run: |
          VST3="build/Cloudy9_artefacts/Release/VST3/Cloudy9.vst3"
          AAX="build/Cloudy9_artefacts/Release/AAX/Cloudy9.aaxplugin"
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AAX"
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "Cloudy9-v${PLUGIN_VERSION}-macOS-Universal-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "$AAX" "Cloudy9-v${PLUGIN_VERSION}-macOS-Universal-AAX-Developer.zip"
      - uses: actions/upload-artifact@v4
        with: {name: Cloudy9-v0.1-macOS-Universal-VST3, path: Cloudy9-v0.1-macOS-Universal-VST3.zip}
      - uses: actions/upload-artifact@v4
        with: {name: Cloudy9-v0.1-macOS-Universal-AAX-Developer, path: Cloudy9-v0.1-macOS-Universal-AAX-Developer.zip}
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.4.zip -OutFile juce.zip
          Expand-Archive juce.zip -DestinationPath juce-unpack
          Move-Item juce-unpack/JUCE-8.0.4 JUCE
      - name: Configure
        run: cmake -S . -B build -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build
        run: cmake --build build --config Release --target Cloudy9_VST3 Cloudy9_AAX Cloudy9DSPTest
      - name: Test
        shell: pwsh
        run: '& "./build/Release/Cloudy9DSPTest.exe"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/Cloudy9_artefacts/Release/VST3/Cloudy9.vst3" -DestinationPath "Cloudy9-v${env:PLUGIN_VERSION}-Windows-x64-VST3.zip"
          Compress-Archive -Path "build/Cloudy9_artefacts/Release/AAX/Cloudy9.aaxplugin" -DestinationPath "Cloudy9-v${env:PLUGIN_VERSION}-Windows-x64-AAX-Developer.zip"
      - uses: actions/upload-artifact@v4
        with: {name: Cloudy9-v0.1-Windows-x64-VST3, path: Cloudy9-v0.1-Windows-x64-VST3.zip}
      - uses: actions/upload-artifact@v4
        with: {name: Cloudy9-v0.1-Windows-x64-AAX-Developer, path: Cloudy9-v0.1-Windows-x64-AAX-Developer.zip}
